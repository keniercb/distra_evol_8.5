[files]
;directorio donde se encuentran certificados y llaves privadas
cert_location = /var/www/html/Zeolides/mio/zeolides-2.3/config/certs/server/
;nombre del sertificado del servidor
certificate = zeol_server.crt
;nombre de la llave privada del servidor
privateKey = zeol_server.key
;nombre del certificado de la Autoridad Certificadora
CAcertificate = ACXETID.pem
;clave de la llave privada del servidor encriptada con RSA, en caso de no poseer dejar en ''
passPhrase = ''
