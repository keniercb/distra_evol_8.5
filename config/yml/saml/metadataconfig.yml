#*************************************************************************************************
# Los certificados y las llaves privadas tienen que estar en la direccion config/certs/auth del marco de trabajo
# Comando consola de ejemplo para generar un certificado y llave privada
#openssl req -newkey rsa:4096 -nodes -keyout zeolides.key -x509 -days 365 -out zeolides.crt
#*************************************************************************************************
#Este archivo de configuración consta de dos partes:
#1- Host:
#    Aquí se configuran los servicios que se van a brindar; IDP (Identity Provider) y SP (Service Provider)
#2- Remote:
#    Aquí se configuran los servicios que se van a consumir
#Nota:
#    Funciona como el protocolo de llaves públicas:
#    En el IDP se copia la llave pública del SP y viceversa (.crt)

seguridad:
        hosted:
            keysDir: "config/certs/auth"
            secretSalt: "asdasd"
            service_provider:
                enabled: "true"
                entityId: "splocal"
                #idp: "https://distra.dev.local.test/seguridad/index.php/identityprovider/sso"
                idp: "localhost"
                assertionConsumerRoute: "https://distra.dev.local.test/seguridad/index.php/serviceprovider/acs"
                certificateFile: "zeolides.crt"
                privateKeys:
                    default: "zeolides.key"
            identity_provider:
                enabled: "true"
                autority: "default"
                entityId: "https://distra.dev.local.test/seguridad/index.php/identityprovider/sso"
                signAssertion: true
                singResponse: true
                attributesNameFormat: "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"
                certificateFile: "zeolides.crt"
                signAuthnRequest: true
                signSloMessage: true
                privateKeys:
                    default: "zeolides.key"
        remote:
            identity_providers:
                'https://distra.dev.local.test/seguridad/index.php/identityprovider/sso':
                    enabled: "true"
                    entityId: "https://distra.dev.local.test/seguridad/index.php/identityprovider/sso"
                    singleSignOnService: "https://distra.dev.local.test/seguridad/index.php/identityprovider/sso"
                    singleLogoutService: "https://distra.dev.local.test/seguridad/index.php/identityprovider/slo"
                    certificateFile: "zeolides.crt"
                    signAuthnRequest: true
                    signSloMessage: true
                    signAssertion: true
                    singResponse: true
                'https://localhost:9443/samlsso':
                    enabled: "true"
                    entityId: "localhost"
                    singleSignOnService: "https://localhost:9443/samlsso"
                    singleLogoutService: "https://localhost:9443/samlsso"
                    certificateFile: "zeolides.crt"
                    signAuthnRequest: true
                    signSloMessage: true
                    signAssertion: true
                    singResponse: true
                'localhost':
                    enabled: "true"
                    entityId: "localhost"
                    singleSignOnService: "https://localhost:9443/samlsso"
                    singleLogoutService: "https://localhost:9443/samlsso"
                    certificateFile: "zeolides.crt"
                    signAuthnRequest: true
                    signSloMessage: true
                    signAssertion: true
                    singResponse: true
            service_providers:
                splocal:
                    enabled: "true"
                    entityId: 'splocal'
                    certificateFile: 'zeolides.crt'
                    assertionConsumerService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'https://distra.dev.local.test/seguridad/index.php/serviceprovider/acs'
                            index: '1'
                    singleLogoutService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'https://distra.dev.local.test/seguridad/index.php/serviceprovider/slo'
                ServiceProviderSymfony.local:
                    enabled: "true"
                    entityId: 'ServiceProviderSymfony.local'
                    certificateData: ""
                    assertionConsumerService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'http://symfony.local:4000/seguridad/serviceprovider/acs'
                            index: '1'
                    singleLogoutService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'http://symfony.local:4000/seguridad/serviceprovider/slo'
                php-sp:
                    enabled: "true"
                    entityId: 'php-sp'
                    certificateData: ""
                    assertionEncryption: "true"
                    assertionConsumerService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'http://php.local:4002/simplesaml/module.php/saml/sp/saml2-acs.php/php-sp'
                            index: '1'
                    singleLogoutService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'http://php.local:4002/simplesaml/module.php/saml/sp/saml2-logout.php/php-sp'
                'http://symfony.local:4000/saml/metadata.xml':
                    enabled: "true"
                    entityId: 'http://symfony.local:4000/saml/metadata.xml'
                    certificateFile: 'saml.crt'
                    assertionConsumerService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'http://symfony.local:4000/saml/login_check'
                            index: '1'
                    singleLogoutService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'http://symfony.local:4000/saml/logout'
                'http://drupal.local.dev/simplesaml/module.php/saml/sp/metadata.php/default-sp':
                    enabled: "true"
                    entityId: 'http://drupal.local.dev/simplesaml/module.php/saml/sp/metadata.php/default-sp'
                    certificateFile: 'development_publickey.cer'
                    assertionConsumerService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'http://drupal.local.dev/simplesaml/module.php/saml/sp/saml2-acs.php/default-sp'
                            index: '1'
                    singleLogoutService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'http://drupal.local.dev/simplesaml/module.php/saml/sp/saml2-logout.php/default-sp'
                'https://localhost:9443':
                    enabled: "true"
                    nameIDFormat: "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"
                    nameIdAttribute: "usuario"
                    signatureAlgorithm: "http://www.w3.org/2000/09/xmldsig#rsa-sha1"
                    entityId: 'https://localhost:9443'
#                    certificateFingerprints:
#                        default: 6B:F8:E1:36:EB:36:D4:A5:6E:A0:5C:7A:E4:B9:A4:5B:63:BF:97:5D
                    certificateData: ''
                    assertionConsumerService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'https://localhost:9443/acs'
                            index: '1'
                    singleLogoutService:
                        post:
                            binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                            location: 'https://localhost:9443/acs/fedletSloPOST'
