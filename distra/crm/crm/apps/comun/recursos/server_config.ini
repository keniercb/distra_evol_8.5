filename = "reporte";
;datasource = '/datasources/gestion-comercial'
;datasource = '/datasources/gestion-empresarial'
datasource = '/datasources/distra_xetid_prod'

[gestordocumental]

[mail]
;principales
username = 'yismel@xetid.cu';
password = 'yismel.2019';
from = 'yismel@xetid.cu';
fromname = 'Gestion comercial';
;configuraciones clasicas
mailer = "smtp";
host = "smtp.xetid.cu";
port = 25;
template = 'plantilla.html';
send_attachement = 'true';
check_attachement = 'true';
;configuraciones auxiliares
enabled = "true";
smtpdebug = 0;
smtpsecure = "";
charset = 'UTF-8';
smtpauth = 0;
timeout = 300;
subject = 'Notificación de Gestion Comercial';
;foot = 'Acceda a http://10.12.46.202:5902 para consultar.';
;template = 'confirmation.html';

;increment_sign = 'true' el nro consecutivo se genera al firmar el contrato
;increment_sign = 'false' el nro consecutivo se genera al crear el contrato
[numeroconsecutivo]
increment_sign = "false";

;mostrar_todos = "true" muestra todos los contratos incluyendo original y cada uno de los suplementos
;mostrar_todos = "false" muestra solo el ultimo contrato o suplemento
[contratosuplemento]
mostrar_todos = "true";

;mostrar_hitos_areas = "true" muestra los contratos que esten en el dominio o
;tengan al menos un hito en el dominio / "false" muestra los contratos que esten en el dominio
;increment_unique = "true" el numero incremental de contrato es el mismo para todas las entidades con la misma configuracion de número/
;increment_unique = "false" el numero incremental de contrato es distinto para cada una de las entidades
;numero_manual = "true" el numero de contrato se introduce manualmente
;numero_manual = "false" el numero de contrato es generado por el sistema
;cliente_tipocontrato = "true" Solo puede haber activo un cliente por tipo de contrato (por cada clase)
;cliente_tipocontrato = "false" No hay asociación entre cliente tipo contrato
[contratos]
mostrar_hitos_areas = "false";
mostrar_todos = "true";
increment_sign = "false";
numero_manual = "false";
cliente_tipocontrato = "false";

;mostrar_todas = 'false' muestra las areas a partir de la entidad logueada, sino muestra todas
;mostrar_filtro = 'true' muestra todos las areas para el filtro
[areas]
mostrar_todas = "true";
mostrar_filtro = "true";
