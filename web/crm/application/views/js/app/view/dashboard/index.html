<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>

    <title>Dashboard CRM</title>
    <link rel="stylesheet" type="text/css" href="../../../../../lib/4.2/resources/ext-theme-classic/ext-theme-classic-all.css"/>
    <link rel="stylesheet" type="text/css" href="./app.css"/>
    <script type="text/javascript" src="../../../../../lib/4.2/jquery.js"></script>
    <script type="text/javascript" src="../../../../../lib/4.2/ext-all-debug.js"></script>
    <style>

        .x-docked-top {
            border-bottom-width: 1px !important;
        }

        .x-border-layout-ct .x-panel-body-default-framed {
            border-top-width: 0px !important;
        }

        .x-panel-default-framed, .x-panel-body-default-framed {
            background-color: #fff;
        }

        .x-grid-row-summary {
            color: #333;
            background: #f1f2f4;
        }

        .x-grid-row-summary .x-grid-cell-inner {
            font-weight: bold;
            padding-bottom: 4px;
            padding-top: 4px;
            border-bottom: 1px solid rgba(147, 147, 147, 0.7);
            border-top: 1px solid rgba(147, 147, 147, 0.7);
            text-align: center !important;
        }

        .x-grid-row-summary .x-grid-cell-first .x-grid-cell-inner {
            text-align: left !important;
        }

        .x-grid-hide-summary .x-grid-row-summary {
            display: none;
        }

        .x-group-sub-header .x-column-header-inner {
            text-align: center;
        }

        /*.fa.fa-area-chart*/

        .x-tool-barchart {
            background-image: url('./resources/sprite.png') !important;
            background-position: 0 0px;
        }

        .x-tool-over .x-tool-barchart {
            background-image: url('./resources/sprite.png') !important;
            background-position: -15px 0;
        }

        .x-tool-linechart {
            background-image: url('./resources/sprite.png') !important;
            background-position: 0 -15px;
        }

        .x-tool-over .x-tool-linechart {
            background-image: url('./resources/sprite.png') !important;
            background-position: -15px -15px;
        }

        .x-tool-pointchart {
            background-image: url('./resources/sprite.png') !important;
            background-position: 0 -30px;
        }

        .x-tool-over .x-tool-pointchart {
            background-image: url('./resources/sprite.png') !important;
            background-position: -15px -30px;
        }

        .x-tool-piechart {
            background-image: url('./resources/sprite.png') !important;
            background-position: 0 -45px;
        }

        .x-tool-over .x-tool-piechart {
            background-image: url('./resources/sprite.png') !important;
            background-position: -15px -45px;
        }
    </style>
