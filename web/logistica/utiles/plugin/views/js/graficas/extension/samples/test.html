<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="../lib/jquery-1.9.0.js"></script>
    <script src="../../highcharts.js"></script>
    <script src="../core.js"></script>
</head>
<body>
<div>
    <select id="types">
        <option value="pie">Pie</option>
        <option value="area">Area</option>
        <option value="bar">Bar</option>
        <option value="column">Column</option>
        <option value="line">Line</option>
        <option value="scatter">Scatter</option>
        <option value="spline">Spline</option>
    </select>
    <select id="data">
        <option value="data1">Data Example 1</option>
        <option value="data2">Data Example 2</option>
        <option value="data3">Data Example 3</option>
    </select>
    <button onclick="renderChart()">Refresh</button>
    <input type="checkbox" id="auto-refresh">Auto refresh
</div>
<div class="grafica" id="grafica">

</div>
<script>
    Ax.onReady(function () {
        var dataExamples = {
            data1: [{
                name: 'test1',
                data: [
                    {a: '10/12/2015', b: 2},
                    {a: '15/12/2015', b: 5},
                    {a: '28/12/2015', b: 1},
                    {a: '25/12/2015', b: 12},
                    {a: '30/12/2015', b: 1}
                ],
                color: 'red'
            }, {
                name: 'test1',
                data: [['10/12/2015', 20], ['15/12/2015', 15], ['20/12/2015', 10], ['28/12/2015', 2], ['31/12/2015', 7]],
                color: 'blue'
            }, {
                name: 'test1',
                data: [['28/12/2015', 10], ['15/12/2015', 5], ['20/12/2015', 2], ['31/12/2015', 17], ['25/12/2015', 2]],
                color: 'yellow'
            }],
            data2: [{
                name: 'test4',
                data: [
                    {a: 1, b: 2},
                    {a: 4, b: 5},
                    {a: 6, b: 1},
                    {a: 10, b: 12},
                    {a: 25, b: 1}
                ],
                color: 'red'
            }, {
                name: 'test5',
                data: [[6, 20], [8, 15], [9, 10], [10, 2], [18, 7]],
                color: 'blue'
            }, {
                name: 'test6',
                data: [[2, 10], [5, 5], [8, 2], [10, 17], [20, 2]],
                color: 'yellow'
            }],
            data3: [{
                name: 'test7',
                data: [
                    {a: 'Xetid', b: 2},
                    {a: 'Uim', b: 5},
                    {a: 'MF', b: 1},
                    {a: 'GAE', b: 12}
                ],
                color: 'red'
            }, {
                name: 'test5',
                data: [['Xetid', 1], ['Uim', 10], ['MF', 5], ['GAE', 2], ['Cimex', 7]],
                color: 'blue'
            }, {
                name: 'test6',
                data: [['Xetid', 10], ['Uim', 5], ['MF', 2], ['GAE', 17], ['AzCuba', 2]],
                color: 'yellow'
            }]
        };
        var chart = new Ax.Charts.Views.Chart({
            config: {
                chartType: 'line',
                x: {
                    label: 'Tururu',
                    source: 'a'
                },
                y: {
                    label: 'Tarara',
                    source: 'b'
                },
                renderTo: 'grafica',
                title: 'Chivirico',
                clickFn: function () {
                    alert(1)
                }
            }
        });
        renderChart = function () {
            var dataIndex = $('#data').val();
            var type = $('#types').val();
            chart.reconfigure({
                data: dataExamples[dataIndex],
                type: type
            });
        }
        $('#types').change(function () {
            if ($('#auto-refresh').prop('checked')) {
                var type = $(this).val();
                chart.changeChartType(type);
            }
        });
        $('#data').change(function () {
            if ($('#auto-refresh').prop('checked')) {
                var index = $(this).val();
                chart.setData(dataExamples[index]);
            }
        });
    })

</script>

</body>
</html>
