<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="../lib/ext/css/ext-all.css" rel="stylesheet" type="text/css"
          media="screen"/>
</head>
<body>
<div class="grafica" id="grafica">

</div>
<script type="text/javascript" src="../lib/ext/js/ext-base.js"></script>
<script type="text/javascript" src="../lib/ext/js/ext-all-debug.js"></script>
<script src="../core.js"></script>
<script>
    Ax.onReady(function () {
        var dataExamples = {
            data1: [{
                name: 'test1',
                data: [
                    {a: '10/12/2015', b: 2},
                    {a: '15/12/2015', b: 5},
                    {a: '28/12/2015', b: 1},
                    {a: '25/12/2015', b: 12},
                    {a: '30/12/2015', b: 1}
                ],
                color: 'red'
            }, {
                name: 'test1',
                data: [['10/12/2015', 20], ['15/12/2015', 15], ['20/12/2015', 10], ['28/12/2015', 2], ['31/12/2015', 7]],
                color: 'blue'
            }, {
                name: 'test1',
                data: [['28/12/2015', 10], ['15/12/2015', 5], ['20/12/2015', 2], ['31/12/2015', 17], ['25/12/2015', 2],],
                color: 'yellow'
            }],
            data2: [{
                name: 'test4',
                data: [
                    {a: 1, b: 2},
                    {a: 4, b: 5},
                    {a: 6, b: 1},
                    {a: 10, b: 12},
                    {a: 25, b: 1}
                ],
                color: 'red'
            }, {
                name: 'test5',
                data: [[6, 20], [8, 15], [9, 10], [10, 2], [18, 7]],
                color: 'blue'
            }, {
                name: 'test6',
                data: [[2, 10], [5, 5], [8, 2], [10, 17], [20, 2]],
                color: 'yellow'
            }],
            data3: [{
                name: 'test7',
                data: [
                    {a: 'Xetid', b: 2},
                    {a: 'Uim', b: 5},
                    {a: 'MF', b: 1},
                    {a: 'GAE', b: 12}
                ],
                color: 'red'
            }, {
                name: 'test5',
                data: [['Xetid', 1], ['Uim', 10], ['MF', 5], ['GAE', 2], ['Cimex', 7]],
                color: 'blue'
            }, {
                name: 'test6',
                data: [['Xetid', 10], ['Uim', 5], ['MF', 2], ['GAE', 17], ['AzCuba', 2]],
                color: 'yellow'
            }]
        };
        var DashboardPanel = new Ax.Charts.Views.DashboardPanel({
            region: 'center'
        });
        var panel = new Ext.Panel({
            title: 'Testing graph',
            region: 'center',
            layout: 'border',
            items: [
                DashboardPanel
            ]
        });
        new Ext.Viewport({
            layout: 'border',
            items: [panel],
            renderTo: 'grafica'
        });
        DashboardPanel.addChart({
            title: 'Chart 1',
            allowTypes: ['line', 'column', 'pie', 'spline'],
            chartType: 'pie'
        }, dataExamples.data1, {x: 'a', y: 'b'});
        DashboardPanel.addChart({
            title: 'Chart 2',
            allowTypes: ['line', 'column', 'pie', 'spline']
        }, dataExamples.data2, {x: 'a', y: 'b'});
        DashboardPanel.addChart({
            title: 'Chart 3',
            allowTypes: ['line', 'column', 'pie', 'spline']
        }, dataExamples.data3, {x: 'a', y: 'b'});


        DashboardPanel.addChart({
            title: 'Chart 8',
            allowTypes: ['line', 'column', 'pie', 'spline'],
            chartType: 'pie'
        },{
            name: 'Cliente-Importe',
            sql:  "select count(ddf.idfactura), coalesce(ncp.nombre,coalesce(de.denominacion,concat(dp.nombre,' ',dp.snombre,' ',dp.papel,' ',dp.sapel))) as cliente, " +
            "sum(ddf.importetotal) as importes from mod_logistica.dat_documento dd inner join mod_logfacturacion.dat_docfactura ddf on ddf.idfactura = dd.iddocumento " +
            "inner join mod_logistica.dat_documentocliente ddc on ddc.iddocumento = dd.iddocumento left join mod_datosmaestros.nom_clientesproveedor ncp on ddc.idcliente = ncp.idclientesproveedores " +
            "left join mod_estructuracomp.dat_estructura de on de.idestructura = ncp.idestructura left join mod_persona.dat_persona dp on dp.idpersona = ncp.idpersona " +
            "group by ddf.idfactura,ncp.nombre,de.denominacion,dp.nombre,dp.snombre,dp.papel,dp.sapel"
        },{
            x: 'cliente',
            y: 'importes'
        });

    }, true);
</script>

</body>
</html>
