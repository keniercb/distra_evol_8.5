<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="../lib/ext/css/ext-all.css" rel="stylesheet" type="text/css"
          media="screen"/>
</head>
<body>
<div class="grafica" id="grafica">

</div>
<script type="text/javascript" src="../lib/ext/js/ext-base.js"></script>
<script type="text/javascript" src="../lib/ext/js/ext-all-debug.js"></script>
<script src="../core.js"></script>
<script>
    Ax.onReady(function () {
        var sqlSources = [{
            name: 'Cliente-Importe',
            sql: "select coalesce(c.nombre, coalesce(de.denominacion,concat(dp.nombre,' ',dp.snombre,' ',dp.papel,' ',dp.sapel))) as cliente," +
            "sum (pp.cantidad) as cantidad,i.denominacion as denominacion,i.codigo " +
            "from mod_logdistribucion.dat_pedido pe inner join mod_logistica.dat_documento d on d.iddocumento = pe.iddocumento " +
            "inner join mod_logistica.dat_documentocliente dc on dc.iddocumento = pe.iddocumento " +
            "left join mod_datosmaestros.nom_clientesproveedor c on dc.idcliente = c.idclientesproveedores " +
            "left join mod_estructuracomp.dat_estructura de on de.idestructura = c.idestructura " +
            "left join mod_persona.dat_persona dp on dp.idpersona = c.idpersona " +
            "left join mod_estructuracomp.dat_estructuraop co on dc.idcliente = co.idestructuraop " +
            "inner join mod_logdistribucion.dat_productopedido pp on pp.idpedido = pe.iddocumento " +
            "inner join mod_datosmaestros.nom_indicador i on i.idindicador = pp.idproducto " +
            "where d.estado = 3 group by i.denominacion, i.codigo, dc.idcliente, c.nombre, de.denominacion, dp.nombre, dp.snombre, dp.papel, dp.sapel"
        }, {
            name: 'Cliente-Facturas',
            sql: "select dped.iddocumento,count(dped.iddocumento) as cantpedidos,coalesce(ncp.nombre,coalesce(de.denominacion,concat(dp.nombre,' ',dp.snombre,' ',dp.papel,' ',dp.sapel))) as cliente," +
            "(select count(drp.idpedido) from mod_logdistribucion.dat_reclamopedido drp where drp.idpedido = dped.iddocumento) as cantreclamos," +
            "(select count(ddi.idpedido) from mod_logdistribucion.dat_distribucionpedido ddi where ddi.idpedido = dped.iddocumento) as cantdistribuidos," +
            "(SELECT count(ddpad.iddocumento) from mod_logistica.dat_documentopadre ddpad where ddpad.iddocumento = dped.iddocumento) as cantfacturas " +
            "from mod_logistica.dat_documento dd inner join mod_logdistribucion.dat_pedido dped on dped.iddocumento = dd.iddocumento " +
            "inner join mod_logistica.dat_documentocliente ddc on ddc.iddocumento = dd.iddocumento left join mod_datosmaestros.nom_clientesproveedor ncp on ddc.idcliente = ncp.idclientesproveedores " +
            "left join mod_estructuracomp.dat_estructura de on de.idestructura = ncp.idestructura left join mod_persona.dat_persona dp on dp.idpersona = ncp.idpersona " +
            "where dd.estado in(3) group by ncp.idclientesproveedores,ncp.nombre,de.denominacion,dp.nombre,dp.snombre,dp.papel,dp.sapel,dped.iddocumento"
        }, {
            name: 'Indicador-Lotes Vencidos',
            sql: "select ni.denominacion,(select count(dl.idproducto) from mod_logistica.dat_lote dl where dl.idproducto = dprod.idproducto and dl.fechavencimiento > now()) as cantlotesvencidos," +
            "(select count(dl.idproducto) from mod_logistica.dat_lote dl where dl.idproducto = dprod.idproducto and dl.fechavencimiento > (dl.fechavencimiento - 15)) as cantlotesproxvencer " +
            "from mod_logistica.dat_documento dd inner join mod_logistica.dat_movimiento dm on dm.iddocumento = dd.iddocumento " +
            "inner join mod_logistica.dat_producto dprod on dprod.idproducto = dm.idproducto inner join mod_datosmaestros.nom_indicador ni on ni.idindicador = dprod.idindicador " +
            "group by ni.denominacion,dprod.idproducto"
        }];
        var DashboardPanel = new Ax.Charts.Views.DashboardPanel({
            region: 'center'
        });
        var panel = new Ext.Panel({
            title: 'Testing graph',
            region: 'center',
            layout: 'border',
            items: [
                DashboardPanel
            ]
        });
        new Ext.Viewport({
            layout: 'border',
            items: [panel],
            renderTo: 'grafica'
        });
        DashboardPanel.addChart({
                    title: 'Pedido-Cliente',
                    allowTypes: ['line', 'column', 'pie', 'spline', 'area'],
                    chartType: 'column'
                }, sqlSources[0], {
                    x: {
                        label: 'Cliente',
                        source: 'cliente'
                    },
                    y: {
                        label: 'Pedidos realizados',
                        source: 'cantidad'
                    }
                },[{
                    name: 'Pedidos realizados',
                    source: 'cantidad'
                }],[{
                    name: 'Nombre cliente',
                    source: 'cliente'
                }]
        );
        DashboardPanel.addChart({
                    title: 'Pedidos por Cliente',
                    allowTypes: ['line', 'column', 'spline', 'pie'],
                    chartType: 'column'
                }, sqlSources[0], {
                    x: {
                        label: 'Cliente',
                        source: 'cliente'
                    },
                    y: {
                        label: 'Cantidad',
                        source: 'cantidad'
                    }
                }, [{ //////Campos por los que se serializa el resultado
                    name: 'Pedidos realizados',
                    source: 'cantidad'
                }], [{ ///////// Filtros
                    name: 'Cliente',
                    value: 'cliente',
                    multiselect: true,
                    serialize: true
                },{ ///////// Filtros
                    name: 'Producto',
                    value: 'denominacion',
                    multiselect: true
                }], {//////Lista de criterios de serializacion
                    'Producto': {
                        x: {
                            name: 'Producto',
                            source: 'denominacion'
                        },
                        y: [{
                            name: 'Cantidad de reclamos',
                            source: 'cantidad'
                        }]
                    }
                }
        );
        DashboardPanel.addChart({
            title: 'Lotes Vencidos',
            allowTypes: ['line', 'column', 'spline'],
            chartType: 'spline'
        }, sqlSources[2], {
            x: {
                label: 'Producto',
                source: 'denominacion'
            },
            y: {
                label: 'Cantidad',
                source: 'cantlotesvencidos'
            }
        }, [{
            name: 'Lotes Vencidos',
            source: 'cantlotesvencidos'
        }, {
            name: 'Lotes por vencer',
            source: 'cantlotesproxvencer'
        }],[{ ///////// Filtros
            name: 'Producto',
            value: 'denominacion',
            multiselect: true
        }]);

        /*DashboardPanel.addChart({
         title: 'Indicador-Lotes Vencidos',//Titulo de la grafica
         allowTypes: ['line', 'column', 'spline'],//Tipos de grafica permitidos
         chartType: 'spline'//Tipo de grafica por defecto
         }, {
         name: 'Query', //alias de la consulta,
         sql: 'Select * from a'//SQL query
         },{
         x: {
         label: 'Cliente',/// Alias de la x principal
         source: 'cliente' //// Dataindex de la x
         },
         y: {
         label: 'Valor', ////Nombre de la y principal
         source: 'valor' ///// Dataindex de la y
         }
         }, [<campos a serializar>({name:<nombre>,source:<dataIndex>})], [<filtros>({name:<nombre>,source:<dataIndex>})]) */

    });
</script>

</body>
</html>
